appId: com.opentick.app
productName: Open Tick
copyright: Copyright © 2026
# Releases are uploaded by .github/workflows/release.yml (not electron-builder).
publish: null
directories:
  buildResources: resources
  output: release
# Runtime tray/window icons (buildResources alone is only used at pack time).
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
# Keep Chromium locale packs small (each language is ~0.5–1.5 MB).
electronLanguages:
  - en-US
  - ru
files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/icon.ico
  # Renderer/UI packages are already bundled into out/renderer — do not ship again.
  - '!node_modules/@floating-ui/**'
  - '!node_modules/@tanstack/**'
  - '!node_modules/@tiptap/**'
  - '!node_modules/date-fns/**'
  - '!node_modules/date-fns-tz/**'
  - '!node_modules/dotenv/**'
  - '!node_modules/linkifyjs/**'
  - '!node_modules/lucide-react/**'
  - '!node_modules/markdown-it/**'
  - '!node_modules/prosemirror-*/**'
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/react-router/**'
  - '!node_modules/react-router-dom/**'
  - '!node_modules/tiptap-markdown/**'
  - '!node_modules/zustand/**'
  # better-sqlite3: keep runtime .node + JS, drop source / amalgamation (~20 MB).
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/build/Release/obj/**'
  - '!node_modules/better-sqlite3/build/deps/**'
  - '!node_modules/better-sqlite3/build/Release/*.lib'
  - '!node_modules/better-sqlite3/build/Release/*.exp'
  - '!node_modules/better-sqlite3/build/Release/*.iobj'
  - '!node_modules/better-sqlite3/build/Release/*.ipdb'
  - '!node_modules/better-sqlite3/build/Release/*.pdb'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!docs/*'
  - '!{.env,.env.*,.eslintrc.*,.prettierrc.*,eslint.config.*,electron.vite.config.*,tsconfig.*}'
asarUnpack:
  # Unpack the whole native module (not only *.node) so require() resolves on Windows.
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/bindings/**'
  - '**/node_modules/file-uri-to-path/**'
# Maximum helps NSIS/DMG size. Do NOT let AppImage inherit it — xz makes
# FUSE mounts crawl (tens of seconds before the window appears).
compression: maximum
beforePack: scripts/beforePack.cjs
win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
mac:
  icon: icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
linux:
  icon: icon.png
  # Avoid spaces in the binary / .desktop Exec path
  executableName: open-tick
  syncDesktopName: true
  # AppImage FUSE cannot host a working chrome-sandbox; keep --no-sandbox.
  # Also force X11 — Wayland ozone often freezes Electron UI.
  executableArgs:
    - --no-sandbox
    - --ozone-platform-hint=x11
  desktop:
    # electron-builder 26+: Desktop Entry keys go under `entry`
    entry:
      StartupWMClass: open-tick
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  category: Utility
appImage:
  # FUSE2 toolset ignores zstd and falls back to root `maximum` → xz (very slow).
  # gzip is honored and mounts quickly.
  compression: gzip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
