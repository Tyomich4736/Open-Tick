<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Open Tick">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#12203A"/>
      <stop offset="100%" stop-color="#1A2F5A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#4772FA"/>
    </linearGradient>
    <linearGradient id="glow" x1="640" y1="120" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>
  <circle cx="640" cy="300" r="260" fill="url(#glow)" filter="url(#soft)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280"/>
    <path d="M160 0 V640 M320 0 V640 M480 0 V640 M640 0 V640 M800 0 V640 M960 0 V640 M1120 0 V640"/>
  </g>

  <!-- app icon -->
  <g transform="translate(550 118)">
    <rect width="180" height="180" rx="40" fill="url(#accent)"/>
    <rect x="46" y="52" width="88" height="94" rx="14" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
    <rect x="65" y="39" width="11" height="19" rx="4" fill="#FFFFFF"/>
    <rect x="104" y="39" width="11" height="19" rx="4" fill="#FFFFFF"/>
    <path d="M66 101 L83 118 L117 78" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="640" y="380" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Open Tick</text>
  <text x="640" y="430" text-anchor="middle" fill="#B7C5E3" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28">Local-first desktop tasks with TickTick sync</text>

  <!-- platform pills -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#E8EEFF">
    <g transform="translate(410 480)">
      <rect width="120" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="60" y="26" text-anchor="middle">Windows</text>
    </g>
    <g transform="translate(550 480)">
      <rect width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="50" y="26" text-anchor="middle">macOS</text>
    </g>
    <g transform="translate(670 480)">
      <rect width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="50" y="26" text-anchor="middle">Linux</text>
    </g>
    <g transform="translate(790 480)">
      <rect width="90" height="40" rx="20" fill="#5B8CFF" fill-opacity="0.22" stroke="#5B8CFF" stroke-opacity="0.55"/>
      <text x="45" y="26" text-anchor="middle">MIT</text>
    </g>
  </g>
</svg>
